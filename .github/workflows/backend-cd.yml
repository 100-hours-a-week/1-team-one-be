name: Backend CD with CodeDeploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_uri:
        description: "배포할 Docker 이미지 URI (예: .../backend:dev-latest)"
        required: true
        type: string
      codedeploy_group:
        required: true
        type: string
      # 알림용 메타데이터
      pr_number:
        description: "PR 번호"
        required: true
        type: number
      pr_title:
        description: "PR 제목"
        required: true
        type: string
      base_ref:
        description: "베이스 브랜치 (main, dev)"
        required: true
        type: string
      actor:
        description: "Triggered by (GitHub 사용자)"
        required: true
        type: string
      repository:
        description: "Repository 이름"
        required: true
        type: string
      run_id:
        description: "GitHub Actions Run ID"
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
      DISCORD_ROLE_BACKEND:
        required: true
      DISCORD_ROLE_BACKEND_ONCALL:
        required: true
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy-via-codedeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC를 사용하므로 Role ARN을 Secrets에서 가져옴
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. EC2에서 사용할 .env 파일 동적 생성
      - name: Create .env for CodeDeploy
        run: |
          echo "ECR_REGISTRY=$(echo ${{ inputs.image_uri }} | cut -d/ -f1)" >> .env
          echo "BACKEND_IMAGE_URI=${{ inputs.image_uri }}" >> .env

      # 2. 배포에 필요한 파일들을 압축 (.env 포함)
      - name: Zip deployment files
        run: zip -r deploy.zip appspec.yml scripts/ .env

      # 3. S3에 업로드 (CodeDeploy가 가져갈 아티팩트 저장소)
      - name: Upload to S3
        run: aws s3 cp deploy.zip s3://raise-developer-k8s-backup/backend/deploy-${{ github.run_id }}.zip

      # 4. CodeDeploy 배포 생성 및 실행
      - name: Create CodeDeploy Deployment
        id: deploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name raise-developer-backend \
            --deployment-group-name ${{ inputs.codedeploy_group }} \
            --s3-location bucket=raise-developer-k8s-backup,key=backend/deploy-${{ github.run_id }}.zip,bundleType=zip \
            --query "deploymentId" \
            --output text)

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      # 4. CodeDeploy 배포 완료 대기 (성공/실패 여부 반환)
      - name: Wait for Deployment Success
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.deploy.outputs.DEPLOYMENT_ID }}

